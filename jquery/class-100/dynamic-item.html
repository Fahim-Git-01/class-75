<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .remove{
            color: red;
        }
        li{
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <input type="text">
    <button type="button">Add</button>
    <ul></ul>

    

    <script src="jquery-4.0.0.min.js"></script>
    <script>
        $("button").click(function (){

            let text = $("input").val();

            $("ul").append(`<li>${text} <button class='remove'> &times;</button></li>`);

            $("input").val("");

        })

       $("ul").on ("click",".remove", (e)=>{
    //    console.log(e.target.closest('li'));
        e.target.closest('li').remove();

       });

    </script>
</body>
</html>
