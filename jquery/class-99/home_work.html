<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text">
    <button>Add</button>
    <ol></ol>

    

    <script src="jquery-4.0.0.min.js"></script>
    <script>
        $("button").click(function (){

            let text = $("input").val();
            $("ol").append(`<li>${text}</li>`);
        });

    </script>
</body>
</html>
